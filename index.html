<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>納期のデッドライン - 作業開始リミット管理アプリ</title>
    <!-- Tailwind CSS (スタイリング用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; }
        .urgency-danger { border-left-color: #ef4444; background-color: #fef2f2; } /* 赤 (超過・緊急) */
        .urgency-warning { border-left-color: #eab308; background-color: #fefce8; } /* 黄 (注意: 24時間以内) */
        .urgency-safe { border-left-color: #22c55e; background-color: #f0fdf4; } /* 緑 (余裕あり) */
        .task-card { border-left-width: 6px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <!-- ヘッダー -->
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">⏱️ 納期のデッドライン</h1>
            <button onclick="exportCSV()" class="bg-white text-blue-600 px-3 py-1 rounded shadow hover:bg-gray-100 text-sm font-semibold">
                📥 CSV出力
            </button>
        </div>
    </header>

    <main class="container mx-auto p-4 flex flex-col lg:flex-row gap-6">
        
        <!-- 左側：入力フォーム -->
        <section class="lg:w-1/3 bg-white p-6 rounded-lg shadow-md h-fit">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">➕ 新規タスク登録</h2>
            <form id="taskForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">タスク名</label>
                    <input type="text" id="taskName" required class="w-full border-gray-300 border rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="例：要件定義書の作成">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">担当者名</label>
                    <input type="text" id="assignee" required class="w-full border-gray-300 border rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="例：山田 太郎">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">顧客納期 (デッドライン)</label>
                    <input type="datetime-local" id="deliveryDate" required class="w-full border-gray-300 border rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">想定作業時間 (時間)</label>
                    <input type="number" step="0.5" min="0.5" id="workHours" required class="w-full border-gray-300 border rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="例：10.5">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">計算モード</label>
                    <select id="calcMode" class="w-full border-gray-300 border rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="24h">24時間連続計算</option>
                        <option value="business">ビジネス稼働日換算 (平日9時〜18時)</option>
                    </select>
                    <p class="text-xs text-gray-500 mt-1">※ビジネス換算は土日および営業時間外を作業時間から除外して期限を前倒しします。</p>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">
                    登録する
                </button>
            </form>
        </section>

        <!-- 右側：タスク一覧とダッシュボード -->
        <section class="lg:w-2/3 flex flex-col gap-4">
            
            <!-- フィルター -->
            <div class="bg-white p-4 rounded-lg shadow-md flex items-center justify-between">
                <div class="flex items-center gap-2 w-full max-w-sm">
                    <label for="filterAssignee" class="text-sm font-bold text-gray-700 whitespace-nowrap">👤 担当者フィルタ:</label>
                    <select id="filterAssignee" class="w-full border-gray-300 border rounded-md p-2" onchange="renderTasks()">
                        <option value="all">すべて表示</option>
                        <!-- 動的に追加されます -->
                    </select>
                </div>
                <div class="text-sm text-gray-600 font-bold" id="taskCountSummary">
                    全タスク: 0件
                </div>
            </div>

            <!-- タスクリスト -->
            <div id="taskList" class="grid gap-4">
                <!-- タスクカードがここに描画されます -->
            </div>
            
            <!-- タスクゼロ状態 -->
            <div id="emptyState" class="hidden text-center text-gray-500 mt-10">
                <div class="text-4xl mb-2">📝</div>
                <p>登録されたタスクはありません。</p>
            </div>

        </section>
    </main>

    <script>
        // タスクデータの初期化 (LocalStorageから読み込み)
        let tasks = JSON.parse(localStorage.getItem('deadlineTasks')) || [];

        // DOMの要素
        const taskForm = document.getElementById('taskForm');
        const taskList = document.getElementById('taskList');
        const filterAssignee = document.getElementById('filterAssignee');
        const emptyState = document.getElementById('emptyState');
        const taskCountSummary = document.getElementById('taskCountSummary');

        // デッドライン逆算ロジック
        function calculateStartDeadline(deliveryDateStr, hours, mode) {
            let current = new Date(deliveryDateStr);
            let minutesRemaining = hours * 60;

            if (mode === '24h') {
                return new Date(current.getTime() - (minutesRemaining * 60 * 1000));
            }

            // ビジネスモード (平日 9:00 - 18:00)
            while (minutesRemaining > 0) {
                current.setMinutes(current.getMinutes() - 1);
                let day = current.getDay();
                let hour = current.getHours();
                
                // 月〜金 (1〜5) かつ 9:00(9)〜17:59(17) を稼働時間とする
                if (day >= 1 && day <= 5 && hour >= 9 && hour < 18) {
                    minutesRemaining--;
                }
            }
            return current;
        }

        // 日付フォーマット関数
        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const h = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${y}/${m}/${d} ${h}:${min}`;
        }

        // 残り時間の計算とテキスト化
        function getRemainingText(deadlineDate) {
            const now = new Date();
            const diffMs = deadlineDate - now;
            
            if (diffMs <= 0) return { text: "超過 / 今すぐ着手！", status: "danger" };
            
            const diffHours = diffMs / (1000 * 60 * 60);
            const d = Math.floor(diffHours / 24);
            const h = Math.floor(diffHours % 24);
            
            let text = `残り ${d > 0 ? d + '日と' : ''}${h}時間`;
            let status = "safe";
            
            if (diffHours < 24) status = "warning";
            if (diffHours < 0) status = "danger";

            return { text, status };
        }

        // 担当者フィルタの更新
        function updateFilterOptions() {
            const currentFilter = filterAssignee.value;
            const assignees = [...new Set(tasks.map(t => t.assignee))];
            
            filterAssignee.innerHTML = '<option value="all">すべて表示</option>';
            assignees.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                filterAssignee.appendChild(opt);
            });
            
            if (assignees.includes(currentFilter)) {
                filterAssignee.value = currentFilter;
            }
        }

        // 削除機能
        function deleteTask(id) {
            if(confirm("このタスクを削除しますか？")) {
                tasks = tasks.filter(t => t.id !== id);
                saveAndRender();
            }
        }

        // UI描画
        function renderTasks() {
            taskList.innerHTML = '';
            
            const filterValue = filterAssignee.value;
            let filteredTasks = tasks.filter(t => filterValue === 'all' || t.assignee === filterValue);
            
            taskCountSummary.textContent = `表示中: ${filteredTasks.length}件`;

            if (filteredTasks.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            // 作業開始デッドラインが近い順にソート
            filteredTasks.sort((a, b) => new Date(a.startDeadline) - new Date(b.startDeadline));

            filteredTasks.forEach(task => {
                const startDeadline = new Date(task.startDeadline);
                const deliveryDate = new Date(task.deliveryDate);
                const remaining = getRemainingText(startDeadline);
                
                const card = document.createElement('div');
                card.className = `task-card bg-white p-4 rounded-lg shadow border border-gray-200 urgency-${remaining.status}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-lg font-bold text-gray-800">${task.taskName}</h3>
                            <p class="text-sm text-gray-500 mt-1">👤 担当: <span class="font-semibold">${task.assignee}</span></p>
                        </div>
                        <div class="text-right">
                            <span class="inline-block px-3 py-1 rounded-full text-sm font-bold bg-white border border-gray-300 shadow-sm">
                                ⏳ 着手期限: <span class="${remaining.status === 'danger' ? 'text-red-600' : 'text-gray-700'}">${remaining.text}</span>
                            </span>
                        </div>
                    </div>
                    
                    <div class="mt-4 grid grid-cols-2 gap-4 bg-gray-50 p-3 rounded text-sm">
                        <div>
                            <p class="text-gray-500 text-xs">作業着手デッドライン</p>
                            <p class="font-bold text-red-600 text-base">${formatDate(startDeadline)}</p>
                        </div>
                        <div>
                            <p class="text-gray-500 text-xs">顧客納期 (${task.mode === 'business' ? 'ビジネス換算' : '24h計算'}・作業${task.workHours}h)</p>
                            <p class="font-bold text-gray-700">${formatDate(deliveryDate)}</p>
                        </div>
                    </div>
                    
                    <div class="mt-3 text-right">
                        <button onclick="deleteTask(${task.id})" class="text-red-500 hover:text-red-700 text-sm font-semibold">
                            🗑️ 削除
                        </button>
                    </div>
                `;
                taskList.appendChild(card);
            });
        }

        // 保存と更新
        function saveAndRender() {
            localStorage.setItem('deadlineTasks', JSON.stringify(tasks));
            updateFilterOptions();
            renderTasks();
        }

        // フォーム送信イベント
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const taskName = document.getElementById('taskName').value;
            const assignee = document.getElementById('assignee').value;
            const deliveryDate = document.getElementById('deliveryDate').value;
            const workHours = parseFloat(document.getElementById('workHours').value);
            const calcMode = document.getElementById('calcMode').value;
            
            const startDeadline = calculateStartDeadline(deliveryDate, workHours, calcMode);

            const newTask = {
                id: Date.now(),
                taskName,
                assignee,
                deliveryDate,
                workHours,
                mode: calcMode,
                startDeadline: startDeadline.toISOString()
            };

            tasks.push(newTask);
            saveAndRender();
            taskForm.reset();
        });

        // CSVエクスポート機能
        function exportCSV() {
            if (tasks.length === 0) {
                alert("出力するデータがありません。");
                return;
            }
            
            // BOM付きで文字化け防止
            let csvContent = "\uFEFFタスク名,担当者,顧客納期,作業時間(h),計算モード,作業着手デッドライン\n";
            
            tasks.forEach(t => {
                const modeText = t.mode === 'business' ? 'ビジネス稼働' : '24h連続';
                const row = [
                    `"${t.taskName}"`,
                    `"${t.assignee}"`,
                    formatDate(new Date(t.deliveryDate)),
                    t.workHours,
                    modeText,
                    formatDate(new Date(t.startDeadline))
                ].join(",");
                csvContent += row + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "deadlines.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 1分ごとにカウントダウン表示を自動更新
        setInterval(renderTasks, 60000);

        // 初期描画
        saveAndRender();
    </script>
</body>
</html>
